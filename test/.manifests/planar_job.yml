kind: Job
version: 1.0.0
# ------------------------------------------------------------------------------------------------------------------------
job type: PlanarJob
name: HelloWorld With Data
group: Demo
description: Demo Hello World Job With Data
durable: true
concurrent: false
# ------------------------------------------------------------------------------------------------------------------------
properties:
  invoke method: process
  process:
    filename: HelloWorldWithData\HelloWorldWithData.exe
# ------------------------------------------------------------------------------------------------------------------------
simple triggers:
  - name: default_trigger
    interval: 00:10:00
    misfire behaviour: FireNow
  - name: default_trigger2
    interval: 1.00:10:00
    misfire behaviour: FireNow