name: res3
value: |                            # Value of the resource [mandatory, up to 1,000,000 characters]
  A supporter of the White House position might argue there is some subjectivity in what constitutes a political ad as distinct from a video that purportedly seeks to highlight higher national interests. But this controversy is playing out in an administration that has repeatedly challenged norms and taboos regarding politics and nonpartisan governance. And there will be deep skepticism over whether a president who has purged inspectors general, ethics officials and civil servants from his own government cares about such concerns.

  The furor is a classic example of provocative behavior Trump uses to draw establishment forces into showdowns that bolster his image as an insurgent, a move that was instrumental to his two presidential election triumphs. At times, this seems like trolling for trolling’s sake. But it feeds a narrative that he’s under perpetual attack from a sinister deep state and that only strongman leadership by Trump can save the nation. The idea that the spot is deliberately provocative is bolstered by the fact that Trump, with a war chest worth hundreds of millions of dollars, doesn’t need to use taxpayer cash.