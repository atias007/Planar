  Is the video, similar to one Trump posted on social media during his 2024 campaign, a legitimate use of public money, in what the White House says is a public service announcement? Or does it represent another blow to good governance by a president who recognizes few limits on his power? 
  In this instance, using taxpayer funds — inevitably including those of citizens who oppose his agenda — for a hyper-political message pre-midterm election message?
