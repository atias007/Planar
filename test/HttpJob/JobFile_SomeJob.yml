job type: PlanarJob
name: HttpHostedTest
group: Demo
author: israel israeli (sales)
description: Invoke job with http
durable: true 
concurrent: false
log retention days: 7

properties:
  invoke method: http
  encrypt payload: true
  http:
    base url: http://localhost:5000
    route: SomeJob

simple triggers:
  - name: every-hour-trigger
    interval: 01:00:00
    misfire behaviour: auto
    timeout: 00:05:00