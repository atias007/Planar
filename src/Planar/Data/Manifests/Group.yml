additional field 3: some additional field 3   # additional field [up to 500 characters]
additional field 4: some additional field 4   # additional field [up to 500 characters]
additional field 5: some additional field 5   # additional field [up to 500 characters]
# --------------------------------------------------------------------------------------------------------------------------------------------------------- #
users:
  - username 1                                # exists username
  - username 2                                # exists username
  - username 3                                # exists username
