kind: user password                 # The kind of manifest file
version: 1.0.0                      # The version of manifest file
# --------------------------------------------------------------------------------------------------------------------------------------------------------- #
username: some username 1           # Unique identifier [mandatory, only alphanumeric, dots, dashes & underscore, 2 to 50 characters]
password: some password 1           # The user password [mandatory, 8 to 32 characters]
                                    #  - must contain at least one digit
                                    #  - must contain at least one uppercase letter
                                    #  - must contain at least one lowercase letter
                                    #  - must not contain space
                                    #  - must not contain 3 identical letters in a row
                                    #  - must not contain special letters: #?!@$%^&*:+-()[]|]