kind: global config                 # The kind of manifest file
version: 1.0.0                      # The version of manifest file
# --------------------------------------------------------------------------------------------------------------------------------------------------------- #
key: some key name 1                # The key name [mandatory, only alphanumeric, dashes & underscore, 3 to 50 characters]
value: some value 1                 # The value [up to 4000 characters]
source url: http://some_source_url  # The source URL [up to 1000 characters].
type: string                        # The type of value [string, json, yml]. 
                                    # in case of json or yml, the value should be a valid json or yml string. 
                                    # in case of json or yml, the value will be flattened to a dictionary of multiple keys.
is secret: false                    # Whether the value is secret or not [true/false].